<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream11 Weighted Picker</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2em auto; }
    textarea { width: 100%; height: 8em; }
    button { margin-top: 1em; padding: 0.5em 1em; font-size: 1em; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.2em 0; }
    .captain { font-weight: bold; color: green; }
    .vice    { font-weight: bold; color: blue; }
  </style>
</head>
<body>
  <h2>Dream11 Weighted Picker</h2>
  <p>Format each entry as <code>ID-role[-impact]:weight</code> (22 total, comma‑separated).  
  e.g.: <code>1a-top:1.0,2a-mid:1.0,11a-bowl-impact:0.2,...</code></p>
  <textarea id="input">
1a-top:1.0,2a-mid:1.0,3a-fin:1.0,4a-bowl:1.0,5a-top:1.0,6a-mid:1.0,7a-bowl:1.0,8a-fin:1.0,9a-bowl:1.0,10a-bowl:1.0,11a-bowl-impact:0.2,
1b-top:1.0,2b-mid:1.0,3b-fin:1.0,4b-bowl:1.0,5b-top:1.0,6b-mid:1.0,7b-bowl:1.0,8b-fin:1.0,9b-bowl:1.0,10b-bowl:1.0,11b-bowl-impact:0.2
  </textarea>
  <button onclick="generateTeam()">Generate Team</button>

  <h3>Your XI</h3>
  <div id="result"></div>

  <script>
    // Weighted pick without replacement (subtract-and-pick) :contentReference[oaicite:0]{index=0}
    function weightedPick(pool, k) {
      const selected = [];
      let total = pool.reduce((sum, p) => sum + p.weight, 0);
      for (let n = 0; n < k; n++) {
        let r = Math.random() * total;                   // uniform [0, total)
        for (let i = 0; i < pool.length; i++) {
          r -= pool[i].weight;
          if (r <= 0) {
            selected.push(pool[i]);
            total -= pool[i].weight;
            pool.splice(i, 1);
            break;
          }
        }
      }
      return selected;
    }

    function generateTeam() {
      const raw = document.getElementById('input').value
                    .trim().split(/\s*,\s*/);
      if (raw.length !== 22) {
        return alert('Please enter exactly 22 entries.');
      }

      // Parse ID-role[-impact]:weight
      const players = raw.map(str => {
        const [left, w] = str.split(':');
        const [id, role, tag] = left.split('-');
        return {
          id: id,
          role: role.toLowerCase(),
          isImpact: tag === 'impact',
          weight: parseFloat(w)
        };
      });

      // Buckets: top/mid non-impact & others/impact :contentReference[oaicite:1]{index=1}
      const topMid = players.filter(p=>
        ['top','mid'].includes(p.role) && !p.isImpact
      );
      const rest   = players.filter(p=>!topMid.includes(p));

      if (topMid.length < 8) {
        return alert('Need at least 8 non-impact top/mid entries.');
      }

      // 1) Pick 8 from top/mid → ensures ~75% :contentReference[oaicite:2]{index=2}
      const first8 = weightedPick(topMid.slice(), 8);

      // 2) Pick remaining 3 from others+impacts
      const last3  = weightedPick(rest.slice(), 3);

      const team = [...first8, ...last3];

      // 3) Captain & VC from top/mid of final team
      const tmInTeam = team.filter(p=>['top','mid'].includes(p.role));
      const C  = tmInTeam[Math.floor(Math.random()*tmInTeam.length)];
      let VC;
      do {
        VC = tmInTeam[Math.floor(Math.random()*tmInTeam.length)];
      } while (VC.id === C.id);

      // Render
      const ul = document.createElement('ul');
      team.forEach(p => {
        const li = document.createElement('li');
        let txt = `${p.id} (${p.role}${p.isImpact? ',impact':''})`;
        if (p.id === C.id)  txt += ' <span class="captain">(C)</span>';
        if (p.id === VC.id) txt += ' <span class="vice">(VC)</span>';
        li.innerHTML = txt;
        ul.appendChild(li);
      });
      const out = document.getElementById('result');
      out.innerHTML = '';
      out.appendChild(ul);
    }
  </script>
</body>
</html>
