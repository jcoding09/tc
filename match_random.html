<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dream11 Random Picker</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 2em auto; padding: 1em; }
    textarea { width: 100%; height: 6em; }
    button { margin-top: 1em; padding: 0.5em 1em; font-size: 1em; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.2em 0; }
    .captain { font-weight: bold; color: green; }
    .vice { font-weight: bold; color: blue; }
  </style>
</head>
<body>
  <h2>Dream11 Random Picker</h2>
  <p>Enter exactly 22 player IDs (comma‑separated). Example default is DC (1a–11a) &amp; GT (1b–11b):</p>
  <textarea id="players">1a,2a,3a,4a,5a,6a,7a,8a,9a,10a,11a,1b,2b,3b,4b,5b,6b,7b,8b,9b,10b,11b</textarea>
  <button onclick="generate()">Generate Team</button>
  <h3>Your Random XI</h3>
  <div id="result"></div>

  <script>
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generate() {
      const txt = document.getElementById('players').value.trim();
      if (!txt) return alert('Please enter 22 IDs.');
      const arr = txt.split(/\s*,\s*/);
      if (arr.length !== 22) return alert('Exactly 22 IDs required, you have ' + arr.length + '.');
      const picked = shuffle([...arr]).slice(0, 11);
      // pick captain & vice-captain (distinct)
      const cidx = Math.floor(Math.random() * 11);
      let vcidx;
      do { vcidx = Math.floor(Math.random() * 11); } while (vcidx === cidx);
      // render
      const ul = document.createElement('ul');
      picked.forEach((p, i) => {
        const li = document.createElement('li');
        if (i === cidx) li.innerHTML = `${p} <span class="captain">(C)</span>`;
        else if (i === vcidx) li.innerHTML = `${p} <span class="vice">(VC)</span>`;
        else li.textContent = p;
        ul.appendChild(li);
      });
      const res = document.getElementById('result');
      res.innerHTML = '';
      res.appendChild(ul);
    }
  </script>
</body>
</html>
