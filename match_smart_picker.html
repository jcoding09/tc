<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dream11 Smart Picker</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2em auto; padding: 1em; }
    textarea { width: 100%; height: 8em; }
    button { margin-top: 1em; padding: 0.5em 1em; font-size: 1em; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.2em 0; }
    .captain { font-weight: bold; color: green; }
    .vice { font-weight: bold; color: blue; }
  </style>
</head>
<body>
  <h2>Dream11 Smart Picker</h2>
  <p>Format: <code>PlayerID-role[-impact]</code> (comma separated, 22 total)</p>
  <textarea id="players">1a-top,2a-mid,3a-fin,4a-bowl,5a-top,6a-mid,7a-bowl,8a-fin,9a-bowl,10a-bowl,11a-bowl-impact,
1b-top,2b-mid,3b-fin,4b-bowl,5b-top,6b-mid,7b-bowl,8b-fin,9b-bowl,10b-bowl,11b-bowl-impact</textarea>
  <button onclick="generate()">Generate Team</button>
  <h3>Your Smart XI</h3>
  <div id="result"></div>

  <script>
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function parsePlayer(entry) {
      const [id, role, tag] = entry.split('-');
      return {
        id, role: role.toLowerCase(), isImpact: tag === 'impact'
      };
    }

    function generate() {
      const raw = document.getElementById('players').value.trim().split(/\s*,\s*/);
      if (raw.length !== 22) return alert("Please enter exactly 22 players.");

      const players = raw.map(parsePlayer);

      const topMid = players.filter(p => ['top', 'mid'].includes(p.role) && !p.isImpact);
      const others = players.filter(p => !topMid.includes(p) && !p.isImpact);
      const impacts = players.filter(p => p.isImpact);

      if (topMid.length < 8) return alert("Not enough top/middle-order players (min 8 needed).");

      const finalTeam = [];
      finalTeam.push(...shuffle(topMid).slice(0, 8)); // 8 from top/mid
      const remainingNeeded = 3;

      const pool = [...others, ...impacts];
      shuffle(pool);
      for (const p of pool) {
        if (finalTeam.length < 11 && !finalTeam.includes(p)) finalTeam.push(p);
      }

      // Random (C) and (VC) from top/mid part of final team
      const finalTopMid = finalTeam.filter(p => ['top', 'mid'].includes(p.role));
      const c = finalTopMid[Math.floor(Math.random() * finalTopMid.length)];
      let vc;
      do {
        vc = finalTopMid[Math.floor(Math.random() * finalTopMid.length)];
      } while (vc.id === c.id);

      // Render
      const ul = document.createElement('ul');
      finalTeam.forEach(p => {
        const li = document.createElement('li');
        let text = `${p.id} (${p.role}${p.isImpact ? ', impact' : ''})`;
        if (p.id === c.id) text += ' <span class="captain">(C)</span>';
        else if (p.id === vc.id) text += ' <span class="vice">(VC)</span>';
        li.innerHTML = text;
        ul.appendChild(li);
      });

      const result = document.getElementById('result');
      result.innerHTML = '';
      result.appendChild(ul);
    }
  </script>
</body>
</html>
